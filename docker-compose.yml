# Mirrors seriestours-website's compose: same Traefik label style, same
# http→https redirect, external network, restart: always.
#
# The certificate resolver name is taken from the LIVE Traefik config, not from
# that repo — see the comment on the certresolver label below.
#
# ONE DELIBERATE DIFFERENCE — the network. Confirmed with Sonet 26 Aug 2026.
#
# seriestours-website joins `frappe_default`, the ERP's Docker network. That is
# correct for that site: it calls the ERP API. This portal joins a dedicated
# `edge` network instead, with Traefik attached to both. Traefik can then route
# to this container while this container has no path to any ERP container or
# database.
#
# This is the intended design, not a workaround: the ERP isolation is meant to
# hold at the infrastructure level, enforced by Docker topology rather than by
# a firewall rule someone has to remember. Do not "simplify" this back onto
# frappe_default.
#
# `edge` must exist and Traefik must be attached to it before this will route —
# see deploy/DEPLOY-PLAN.md.

services:
  web:
    build: .
    container_name: b2b-portal-web
    restart: always
    environment:
      - NODE_ENV=production
      # The database file lives on the bind mount below, not in the image.
      - DATABASE_URL=file:/app/data/prod.db
      - PORTAL_URL=https://b2b.seriestours.com
      # Agent documents live beside prod.db on the SAME bind mount, so they
      # survive a container rebuild exactly like the database does.
      - UPLOAD_DIR=/app/data/uploads
      # ANTHROPIC_API_KEY comes from .env.production — the AI rate-sheet
      # import refuses to run without it rather than falling back to a stub.
      # Runs the admin upsert on boot; the seeded password is one-time and the
      # app forces a change at first sign-in.
      - RUN_SEED_ON_START=1
    env_file:
      # AUTH_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD. Never committed; created on
      # the server with 600 permissions.
      - .env.production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.b2bportal.rule=Host(`b2b.seriestours.com`)"
      - "traefik.http.routers.b2bportal.entrypoints=websecure"
      # main-resolver, NOT acme. The resolver is defined as
      # --certificatesResolvers.main-resolver.acme... in the shared
      # frappe-compose.yml on the box. The name `acme` appears in the
      # seriestours-website repo's compose, but that file is stale relative to
      # what is actually running — copying it produced
      # "Router uses a nonexistent certificate resolver". Confirmed against the
      # live ERP frontend router, 26 Aug 2026.
      - "traefik.http.routers.b2bportal.tls.certresolver=main-resolver"
      - "traefik.http.services.b2bportal.loadbalancer.server.port=3000"
      - "traefik.http.routers.b2bportal-http.rule=Host(`b2b.seriestours.com`)"
      - "traefik.http.routers.b2bportal-http.entrypoints=web"
      - "traefik.http.routers.b2bportal-http.middlewares=b2bportal-https-redirect"
      - "traefik.http.middlewares.b2bportal-https-redirect.redirectscheme.scheme=https"

networks:
  edge:
    external: true
