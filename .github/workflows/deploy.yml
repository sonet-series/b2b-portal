# Mirrors seriestours-website's workflow: push to main, SSH in, pull, rebuild.
#
# Differences, both because this app owns a database:
#   - no `docker compose down` before build, so downtime is a restart rather
#     than the length of a full image build
#   - the health check hits a real page, not just container status
name: Deploy to Hetzner

on:
  push:
    branches: [main]
  # So a stuck or mis-keyed pipeline can be re-run from the Actions tab
  # without inventing a commit to push.
  workflow_dispatch:

# A deploy is not something to run twice at once. Two overlapping runs would
# both `git pull`, both build, and both restart the same container — and the
# loser could leave it on the older image. `cancel-in-progress: false` because
# the run already building may be mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # appleboy/ssh-action fails in about 8 seconds with a bare "exit code 1"
      # when a secret is missing, which is indistinguishable from the server
      # refusing the key. 60 consecutive runs failed that way before anyone
      # worked out which it was. Say it instead of making the next person
      # guess.
      - name: Check the deploy secrets exist
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$USER" ] || missing="$missing SERVER_USER"
          [ -n "$KEY" ]  || missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            echo "See deploy/DEPLOY-PLAN.md for what each one should contain."
            exit 1
          fi
          # The commonest mistake by a distance: the PUBLIC key pasted where
          # the private one belongs. It cannot authenticate and the error it
          # produces says nothing about why.
          case "$KEY" in
            ssh-rsa*|ssh-ed25519*|ecdsa-*)
              echo "::error::SERVER_SSH_KEY looks like a PUBLIC key (it starts with ssh-ed25519 or similar)."
              echo "It needs the PRIVATE key — the whole file including the"
              echo "-----BEGIN ... PRIVATE KEY----- and -----END ...----- lines."
              exit 1 ;;
          esac
          case "$KEY" in
            *"PRIVATE KEY"*) : ;;
            *)
              echo "::error::SERVER_SSH_KEY has no PRIVATE KEY header. Paste the whole key file, header and footer included."
              exit 1 ;;
          esac
          echo "All three secrets are present and the key looks like a private key."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/b2b-portal
            # Pulled HERE as well as inside deploy.sh, and that is not
            # redundant: without it this runs the PREVIOUS version of the
            # script. Its own pull is then a no-op.
            git pull origin main

            # deploy.sh, not a second copy of these steps.
            #
            # The two had already drifted: the script backs up, polls the app
            # directly rather than waiting on Docker's healthcheck interval,
            # fails fast on a restarting container, trims the build cache and
            # records what it deployed. None of that was here, so a CI deploy
            # and a hand deploy did measurably different things — and the one
            # that ran unattended was the weaker of the two.
            #
            # DEPLOYED_BY is recorded in data/deploy-status.json, so
            # /admin/settings can say whether what is running got there by
            # pipeline or by hand.
            DEPLOYED_BY=ci bash deploy/deploy.sh
